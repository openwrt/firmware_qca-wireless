name: BDF info

on: pull_request

permissions:
  contents: read

jobs:
  determine_changed_files:
    name: Determine Changed Files
    uses: openwrt/actions-shared-workflows/.github/workflows/reusable_determine_changed_files.yml@483a355b2ee8493c954e89e7a83534cd850842de # main

  determine_changed_bdfs:
    name: Determine changed BDF-s
    needs: determine_changed_files
    runs-on: ubuntu-latest
    env:
      ALL_CHANGED_FILES: ${{ needs.determine_changed_files.outputs.all_changed_files }}
    outputs:
      ath10k_changed_bdfs: ${{ steps.find_bdfs.outputs.ath10k_changed_bdfs }}
      ath11k_changed_bdfs: ${{ steps.find_bdfs.outputs.ath11k_changed_bdfs }}
      ath12k_changed_bdfs: ${{ steps.find_bdfs.outputs.ath12k_changed_bdfs }}

    steps:
      - name: Determine changed BDF-s
        id: find_bdfs
        run: |
          set -euo pipefail

          write_multiline_output() {
            local name="$1"
            local value="$2"
            local delimiter

            delimiter="$(uuidgen)"
            {
              echo "${name}<<${delimiter}"
              printf '%s\n' "$value"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          }

          # Find list of ath10k changed BDF-s
          ATH10K_CHANGED_BDFS="$(printf '%s\n' "$ALL_CHANGED_FILES" | tr ' ' '\n' | grep -E '\.(qca4019|qca9888|qca9889|qca9984|qca9988|qca99x0)$' || true)"

          # Find list of ath11k changed BDF-s
          ATH11K_CHANGED_BDFS="$(printf '%s\n' "$ALL_CHANGED_FILES" | tr ' ' '\n' | grep -E '\.(ipq5018|ipq6018|ipq8074|qcn6122|qcn9074)$' || true)"

          # Find list of ath12k changed BDF-s
          ATH12K_CHANGED_BDFS="$(printf '%s\n' "$ALL_CHANGED_FILES" | tr ' ' '\n' | grep -E '\.(qcn9274|wcn7850)$' || true)"

          write_multiline_output ath10k_changed_bdfs "$ATH10K_CHANGED_BDFS"
          write_multiline_output ath11k_changed_bdfs "$ATH11K_CHANGED_BDFS"
          write_multiline_output ath12k_changed_bdfs "$ATH12K_CHANGED_BDFS"

  print_bdf_info:
    name: Print BDF info
    if: ${{ needs.determine_changed_bdfs.outputs.ath10k_changed_bdfs != '' || needs.determine_changed_bdfs.outputs.ath11k_changed_bdfs != '' || needs.determine_changed_bdfs.outputs.ath12k_changed_bdfs != '' }}
    needs: determine_changed_bdfs
    runs-on: ubuntu-latest
    env:
      ATH10K_CHANGED_BDFS: ${{ needs.determine_changed_bdfs.outputs.ath10k_changed_bdfs }}
      ATH11K_CHANGED_BDFS: ${{ needs.determine_changed_bdfs.outputs.ath11k_changed_bdfs }}
      ATH12K_CHANGED_BDFS: ${{ needs.determine_changed_bdfs.outputs.ath12k_changed_bdfs }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Get required tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: qca/qca-swiss-army-knife
          path: qca_tools
          sparse-checkout: |
            tools/scripts/ath10k/ath10k-bdencoder
            tools/scripts/ath11k/ath11k-bdencoder
            tools/scripts/ath12k/ath12k-bdencoder
          sparse-checkout-cone-mode: false

      - name: Print ath10k BDF info
        if: ${{ needs.determine_changed_bdfs.outputs.ath10k_changed_bdfs != '' }}
        run: |
          while IFS= read -r BDF; do
            [ -n "$BDF" ] || continue
            echo "BDF info for $BDF"
            python3 qca_tools/tools/scripts/ath10k/ath10k-bdencoder -i "$BDF"
          done <<< "$ATH10K_CHANGED_BDFS"

      - name: Print ath11k BDF info
        if: ${{ needs.determine_changed_bdfs.outputs.ath11k_changed_bdfs != '' }}
        run: |
          while IFS= read -r BDF; do
            [ -n "$BDF" ] || continue
            echo "BDF info for $BDF"
            python3 qca_tools/tools/scripts/ath11k/ath11k-bdencoder -i "$BDF"
          done <<< "$ATH11K_CHANGED_BDFS"

      - name: Print ath12k BDF info
        if: ${{ needs.determine_changed_bdfs.outputs.ath12k_changed_bdfs != '' }}
        run: |
          while IFS= read -r BDF; do
            [ -n "$BDF" ] || continue
            echo "BDF info for $BDF"
            python3 qca_tools/tools/scripts/ath12k/ath12k-bdencoder -i "$BDF"
          done <<< "$ATH12K_CHANGED_BDFS"
